<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="sealBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="85%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Border -->
  <circle cx="200" cy="200" r="190" fill="url(#sealBg)" stroke="url(#goldGrad)" stroke-width="8" />
  <circle cx="200" cy="200" r="172" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="6,4" opacity="0.8" />
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Center Emblem -->
  <g transform="translate(200, 185) scale(1.1)">
    <!-- Traditional Calligraphic Pen / Reed Pen Emblem -->
    <path d="M-8,-80 L8,-80 L14,10 L0,50 L-14,10 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" />
    <path d="M0,-80 L0,48" stroke="#78350f" stroke-width="1.5" />
    <!-- Ink Drop -->
    <circle cx="0" cy="62" r="6" fill="#fef08a" />
  </g>

  <!-- Center Calligraphic Typography Representation -->
  <text x="200" y="145" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="28" letter-spacing="1">مركز يوسف ذنون</text>
  <text x="200" y="275" text-anchor="middle" fill="#fde047" font-family="sans-serif" font-weight="700" font-size="18">لتعليم الخط العربي أون لاين</text>
  <text x="200" y="305" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-weight="600" font-size="12" letter-spacing="1">YUSUF THNUN CALLIGRAPHY</text>

  <!-- Star accents -->
  <polygon points="200,325 204,335 215,335 206,341 210,351 200,345 190,351 194,341 185,335 196,335" fill="url(#goldGrad)" />
</svg>
